services:

  # ── PostgreSQL ────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: coderswar_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: coderswar_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django (Daphne ASGI) ──────────────────────────────────────
  web:
    build: .
    container_name: coderswar_web
    restart: unless-stopped
    command: bash entrypoint.sh
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file: .env.production
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  # ── Celery Worker ─────────────────────────────────────────────
  celery:
    build: .
    container_name: coderswar_celery
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=4
    env_file: .env.production
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Beat (scheduled tasks) ─────────────────────────────
  beat:
    build: .
    container_name: coderswar_beat
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    env_file: .env.production
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Nginx ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: coderswar_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      # Frontend statik HTML fayllar (backend papkasidan bir daraja yuqorida)
      - ../frontend:/app/frontend:ro
      # Let's Encrypt challenge (SSL uchun)
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  certbot_www:
